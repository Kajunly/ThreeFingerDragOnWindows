name: Build Chinese MSIX (x64)

on:
  workflow_dispatch: {}
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create self-signed signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $password = ConvertTo-SecureString -String "cnpatch2026" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=A5174EBF-789F-4CD5-BF8B-E0CB932DB9AD" `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -FriendlyName "ThreeFingerDragOnWindows CN Build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -NotAfter (Get-Date).AddYears(5)
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\cert.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\artifacts\ThreeFingerDragOnWindows-CN.cer" -Type CERT
          Write-Host "Certificate created: $($cert.Thumbprint)"

      - name: Restore NuGet packages
        run: msbuild ThreeFingerDragOnWindows.sln -t:Restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build and package
        id: build
        shell: pwsh
        run: |
          $output = & msbuild ThreeFingerDragOnWindows.sln -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\cert.pfx" `
            -p:PackageCertificatePassword=cnpatch2026 2>&1
          $output | ForEach-Object { $_.ToString() } | Set-Content -Path build.log -Encoding utf8
          $output | ForEach-Object { $_.ToString() }
          exit $LASTEXITCODE

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $lines = Get-Content build.log
            $err = @($lines | Where-Object { $_ -match '(?i)error|fatal|exception' })
            if ($err.Count -eq 0) { $err = @($lines | Select-Object -Last 20) }
            $err | Select-Object -Last 12 | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Write-Host "::error::build.log not found"
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = Get-ChildItem -Path . -Recurse -Include *.msixbundle,*.msix | Select-Object -First 1
          if ($bundle) { Copy-Item $bundle.FullName -Destination "dist\" } else { Write-Host "No msix found" }
          Copy-Item "artifacts\ThreeFingerDragOnWindows-CN.cer" -Destination "dist\" -ErrorAction SilentlyContinue
          Write-Host "=== dist ==="
          Get-ChildItem dist | Select-Object Name

      - name: Upload package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ThreeFingerDragOnWindows-CN-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## ThreeFingerDragOnWindows 中文版（汉化）

            macOS 风格的三指拖拽工具，界面已汉化为简体中文。

            ### 安装步骤
            1. 卸载商店版（若已安装）：设置 → 应用 → 已安装的应用 → Three Finger Drag → 卸载
            2. 双击 `ThreeFingerDragOnWindows-CN.cer` → 安装证书 → 本地计算机 → 将证书放入「受信任的人（Trusted People）」
            3. 双击 `.msixbundle` → 安装
            4. 若提示需要旁加载：设置 → 隐私和安全性 → 开发者选项 → 打开「开发人员模式」后重新安装

            ### 注意
            - 中文版与商店版为同一应用身份，不能并存，请先卸载商店版
            - 证书为每次构建自动生成的自签名证书，仅用于本地旁加载
