name: Build Chinese MSIX (x64)

on:
  workflow_dispatch: {}
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create self-signed signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $password = ConvertTo-SecureString -String "cnpatch2026" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=A5174EBF-789F-4CD5-BF8B-E0CB932DB9AD" `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -FriendlyName "ThreeFingerDragOnWindows CN Build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -NotAfter (Get-Date).AddYears(5)
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\cert.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\artifacts\ThreeFingerDragOnWindows-CN.cer" -Type CERT
          Write-Host "Certificate created: $($cert.Thumbprint)"

      - name: Restore NuGet packages
        run: msbuild ThreeFingerDragOnWindows.sln -t:Restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build and package
        id: build
        shell: pwsh
        run: |
          $output = & msbuild ThreeFingerDragOnWindows.sln -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\cert.pfx" `
            -p:PackageCertificatePassword=cnpatch2026 2>&1
          $output | ForEach-Object { $_.ToString() } | Set-Content -Path build.log -Encoding utf8
          $output | ForEach-Object { $_.ToString() }
          exit $LASTEXITCODE

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $lines = Get-Content build.log
            $err = @($lines | Where-Object { $_ -match '(?i)error|fatal|exception' })
            if ($err.Count -eq 0) { $err = @($lines | Select-Object -Last 20) }
            $err | Select-Object -Last 12 | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Write-Host "::error::build.log not found"
          }

      - name: List produced packages
        shell: pwsh
        run: |
          Write-Host "=== MSIX packages ==="
          Get-ChildItem -Path . -Recurse -Include *.msix,*.msixbundle | Select-Object -ExpandProperty FullName
          Write-Host "=== Certificates ==="
          Get-ChildItem -Path . -Recurse -Include *.cer | Select-Object -ExpandProperty FullName

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ThreeFingerDragOnWindows-CN-x64
          path: |
            **/*.msix
            **/*.msixbundle
            **/*.cer
          if-no-files-found: error
